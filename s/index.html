<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>James Hunter &#8211; Computer Software &amp; Web Development</title>
<base href="/"/>
<link rel='stylesheet' id='bootstrap-css' href='wp-content/themes/astrid/css/bootstrap/bootstrap.min68b3.css?ver=1' type='text/css' media='all'/>
<link rel='stylesheet' id='astrid-style-css' href='wp-content/themes/astrid/style5010.css?ver=4.9.8' type='text/css' media='all'/>
<link rel='stylesheet' id='font-awesome-css' href='wp-content/themes/astrid/fonts/font-awesome.min5010.css?ver=4.9.8' type='text/css' media='all'/>
<link rel="stylesheet" type="text/css" href="assets/css/custom-style.css"/>
<script type="text/javascript" src="assets/jquery/jquery-4.0.0.min.js"></script>

<script type="module">
import {commonElements, postInfo} from "/assets/js/mod-site-content.js";
commonElements();
let keyPhrase = window.location.search.replace(/\+/g, " ");
keyPhrase = decodeURIComponent(keyPhrase);
// keyArr should contain only 'safe' words.
const keyArr = keyPhrase.match(/([C]\+\+|[A-Z0-9#_-]+)/gi);
if(keyArr){
  keyPhrase = keyArr.join(" ");
  $("#search-header span").text(keyPhrase);
  // escaping the '+' character in the search expression handles searches on 'C++'.
  const keyPhraseRE = new RegExp(keyPhrase.replaceAll("+", "\\+"), "i");
  const results = $.map(postInfo,(content, p)=>{
    return new Promise(resolve=>{
      $.get(p + "/searchable.txt", text=>{
        if(text.search(keyPhraseRE) != -1){
          resolve(content);
        } else {
          resolve();
        }
      });
    })
  });
  const contentBox = $("div.posts-layout");
  (async () => {for await (const entry of results){
      if(entry){
        contentBox.append(entry);
    }}
  })();
}
</script>

</head>
<body class="page-template-default page">

<div class="preloader-inner">
<ul><li></li><li></li><li></li><li></li><li></li><li></li></ul>

</div>

</header>

</div>

<aside id="search-2" class="widget widget_search">

    <label>
      <span class="screen-reader-text">Search for:</span>
      <input type="search" class="search-field fa" style="width:75%" placeholder="&#xf002;&nbsp;Search posts &hellip;" value="" name="*"/>
    </label>
    <input type="submit" class="search-submit" value="Search"/>

</aside>
</aside><!-- #secondary -->
