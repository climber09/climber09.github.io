<script type="module">
import defaultContent, {commonElements} from "/assets/js/mod-site-content.js";
import util from "/assets/js/mod-site-util.js";
commonElements();
const uri = (location.pathname + location.search).replace(/[^a-z_0-9\/\.]/gi, "").replace(/\/*$/, "/article.html");
$.get(uri, (postContent)=>{
  $("main").html(postContent);
  setPopupLinks();
  setModalImg();
}).fail(()=>{
    $("main").html(defaultContent());
});
const offset = "javascript:void".length;
function setPopupLinks(){
  const links = $("a.popup")
  $.each(links, (i, link)=>{
    link.setAttribute("title", "You may need to disable your browser's pop-up blocker or ad-blocker to view properly");
    link.onclick = ()=>{
      const args = eval(link.href.substring(offset));
      util.popup.open(...args);
    }
  })
}
function setModalImg(){
  const modalImg = $("img.image-thumb");
  if(modalImg.length){
    util.modal.init();
  }
  $.each(modalImg, (i, img)=>{
    img.onclick = ()=>{util.modal.show(img)};
  });
}
</script>
