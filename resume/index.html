<script type="module">
import {commonElements} from "/assets/js/mod-site-content.js";
import resumeContent, {hasSection} from "/resume/mod-resume-content.js";
commonElements();
let section = window.location.search.replace(/[^a-z]/g, "");
if(!hasSection(section)){
  section = "summary"
}
$("ul#nav2 li a").each((i, link)=>{
   if(link.innerText.toLowerCase().indexOf(section) > -1){
     link.setAttribute("class", "active");
     return;
   }
});
$("div#entry-box").html(resumeContent(section));
</script>
