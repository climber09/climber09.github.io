<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>James Hunter &#8211; Computer Software &amp; Web Development</title>
<base href="/"/>
<link rel='stylesheet' id='bootstrap-css' href='wp-content/themes/astrid/css/bootstrap/bootstrap.min68b3.css?ver=1' type='text/css' media='all'/>
<link rel='stylesheet' id='astrid-style-css' href='wp-content/themes/astrid/style5010.css?ver=4.9.8' type='text/css' media='all'/>
<link rel='stylesheet' id='font-awesome-css' href='wp-content/themes/astrid/fonts/font-awesome.min5010.css?ver=4.9.8' type='text/css' media='all'/>
<link rel="stylesheet" type="text/css" href="assets/css/custom-style.css"/>
<script type="text/javascript" src="assets/jquery/jquery-4.0.0.min.js"></script>

<script type="module">
import * as site from "/assets/js/mod-site-content.js";
site.commonElements();
const topicKey = window.location.search.replace(/[^a-z]/g, "");
if(!site.topicInfo[topicKey]){
  $("main").html(site.default());
}else{
  const topic = site.topicInfo[topicKey];
  $("#topic-label").append(topic.label);
  const posts = site.getPosts(topicKey);
  const contentBox = $("div.posts-layout");
  $.each(posts, (i, key)=>{
    contentBox.append(site.postInfo[key]);
  });
}
</script>

</head>
<body class="page-template-default page">
<div class="preloader">
<div class="preloader-inner">
<ul><li></li><li></li><li></li><li></li><li></li><li></li></ul>
</div>
</div>
<div id="page" class="site">
<a class="skip-link screen-reader-text" href="#content">Skip to content</a>
<header id="masthead" class="site-header " role="banner"></header><!-- #masthead -->
<div class="header-clone"></div><div id="content" class="site-content">
<div class="container">
<div id="primary" class="content-area">
<main id="main" class="site-main" role="main">
<header class="page-header"><h1 id="topic-label" class="page-title"><i class="fa fa-folder-o"></i></h1></header>
<div class="posts-layout"></div>
</main><!-- #main -->
</div><!-- #primary -->
<aside id="secondary" class="widget-area" role="complementary">
<aside id="search-2" class="widget widget_search">
  <form role="search" method="get" class="search-form" action="s">
    <label>
      <span class="screen-reader-text">Search for:</span>
      <input type="search" class="search-field fa" style="width:75%" placeholder="&#xf002;&nbsp;Search posts &hellip;" value="" name="*"/>
    </label>
    <input type="submit" class="search-submit" value="Search"/>
  </form>
</aside>
</aside><!-- #secondary -->
</div>
</div><!-- #content -->
</div><!-- #page -->
<!-- Blog Page Right -->
<script type='text/javascript' src='wp-content/themes/astrid/js/main5010.js?ver=4.9.8'></script>
<script type='text/javascript' src='wp-content/themes/astrid/js/scripts.min5010.js?ver=4.9.8'></script>
</body>
</html>
