<script type="text/javascript">
$(document).ready(()=>{
  const topicKey = window.location.search.replaceAll(/[^a-z]/g, "");
  if(topicKey === "" || !topicInfo[topicKey]){
    defaultContent($("main"));
    return;
  }
  const topic = topicInfo[topicKey];
  $("main header h1#topic-label").append(topic.label);
  const contentBox = $("main div.posts-layout");
  $.each(topic.posts, (i, key)=>{
    contentBox.append(postInfo[key]);
  });
});
</script>
