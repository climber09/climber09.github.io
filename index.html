<script type="module">
import defaultContent, {commonElements} from "/assets/js/mod-site-content.js";
const adjust = {
  imgW: 1920,
  imgH: 680,
  offset: 123
}
function resizeHeight(){
  const h = adjust.imgH - ((adjust.imgW - document.documentElement.clientWidth) / adjust.imgW * adjust.imgH);
  document.body.style.height = document.documentElement.clientHeight + h - adjust.offset + 'px';
}
window.addEventListener('load', resizeHeight);
window.addEventListener('resize', resizeHeight);
commonElements();
$("main").html(defaultContent());
</script>

<style type="text/css" id="wp-custom-css">
a.button{
  padding: 3px 12px;
  font-size: 12px;
  text-decoration: none;
}
a.button:link, a.button:visited{color: #fcd088;}
a.button:hover{color: #333;}
</style>
</head>
